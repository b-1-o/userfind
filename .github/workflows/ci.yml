name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Verify production artifact excludes tests and includes every word list
        run: |
          test -f dist/index.js
          test -f dist/data/words-en.txt
          test -f dist/data/words-ru-latin.txt
          test -f dist/data/names-given.txt
          test -f dist/data/names-surname.txt
          test ! -d dist/tests
      - run: npm test
      - name: Audit production and development dependencies
        run: |
          npm audit --json > /tmp/userfind-audit.json || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const audit = JSON.parse(fs.readFileSync("/tmp/userfind-audit.json", "utf8"));
            const summary = audit.metadata?.vulnerabilities ?? {};
            console.log("Audit summary:", JSON.stringify(summary));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log("\n" + name + " — " + item.severity + (item.isDirect ? " (direct)" : " (transitive)"));
              for (const via of item.via ?? []) {
                if (typeof via === "object") console.log("  " + via.title + " | range: " + via.range + " | url: " + via.url);
              }
            }
            if ((summary.total ?? 0) > 0) {
              console.error("Dependency audit found vulnerable packages.");
              process.exit(1);
            }
          '